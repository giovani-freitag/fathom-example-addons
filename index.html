<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Fathom example addons</title>
        <meta
            name="description"
            content="Worked indicators for Fathom, source and all. Paste an address into the chart's own editor, or read them here first."
        />
        <meta name="theme-color" content="#05080c" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./src/site/style.css" />
    </head>
    <body>
        <header id="masthead">
            <!-- The book, as the chart draws it: resting size at every price,
                 second by second. Decoration that is also the subject. -->
            <div class="ladder" aria-hidden="true"></div>
            <div class="masthead-inner">
                <p class="eyebrow" data-says="eyebrow">Worked examples</p>
                <h1 data-says="title">Fathom addons</h1>
                <p class="lede" data-says="lede"></p>
                <nav aria-label="Elsewhere">
                    <a class="go" href="https://giovani-freitag.github.io/fathom/"
                       data-says="openTheChart">Open the chart</a>
                    <a id="guide" href="https://giovani-freitag.github.io/fathom/guide/writing-a-reading"
                       data-says="writeYourOwn">Write your own</a>
                    <a href="https://github.com/giovani-freitag/fathom-example-addons"
                       data-says="source">Source</a>
                    <button type="button" id="language" class="language"></button>
                </nav>
            </div>
        </header>

        <main id="page">
            <section id="how" aria-labelledby="how-title">
                <h2 id="how-title" data-says="threeWaysIn">Three ways in</h2>
                <ol class="ways">
                    <li><strong data-says="wayPasteTitle"></strong> <span data-says="wayPasteBody"></span></li>
                    <li><strong data-says="wayFileTitle"></strong> <span data-says="wayFileBody"></span></li>
                    <li><strong data-says="wayHandTitle"></strong> <span data-says="wayHandBody"></span></li>
                </ol>
            </section>

            <div id="addons"></div>
        </main>

        <footer id="foot">
            <p data-says="footer"></p>
        </footer>
        <script type="module" src="./src/site/main.ts"></script>
    </body>
</html>
