name: check

on:
  push:
    branches: [main]
  pull_request:

# A reading that does not compile against Fathom's real surface is a reading
# nobody can open, so this runs on everything.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/bundles
