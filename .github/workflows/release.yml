name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# The version, the changelog and the tag are all read off the commit subjects,
# so `feat:` and `fix:` are the only two that move anything.
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - id: please
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

      # Handed to a workflow of its own rather than run as a second job here.
      # Attaching the bundles is publishing, and publishing that fails should be
      # something a person can run again on its own — re-running this workflow
      # would find no new release and do nothing at all.
      #
      # `repository_dispatch` rather than the tag push release-please just made:
      # a push made with the workflow token deliberately triggers nothing, so a
      # tag trigger would never fire on the releases it was written for. Dispatch
      # is the one event exempt from that, and same-repo dispatch needs no token
      # beyond the workflow's own.
      - if: steps.please.outputs.release_created == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: release-published
          client-payload: '{"tag": "${{ steps.please.outputs.tag_name }}"}'
