name: pages

# On main rather than on a tag. A release-please tag is pushed with the
# workflow token, which by design triggers nothing, so a tag trigger here would
# never fire on the releases it was written for. The site is the source as it is
# committed, and main is where that lives.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, and never cancelling one that is part way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages is turned on once against the repository, by hand or through the
      # API. `enablement: true` here cannot do it: creating the site needs admin
      # rights, and the workflow token is not given them however the permissions
      # block is written.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
